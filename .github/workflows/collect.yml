name: 收集报名

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 解析 Issue 并写入表格
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/collect.py

      - name: 提交表格变更
        run: |
          git config user.name "meetup-bot"
          git config user.email "meetup-bot@users.noreply.github.com"
          git add data/registrations.csv
          if git diff --staged --quiet; then
            echo "表格无变化"
          else
            git commit -m "报名 #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            git push
          fi

      - name: 给 Issue 打标记
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            if (!body.includes("### 姓名")) {
              core.info("不是报名单，跳过");
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ 报名已收到，已进审核表。\n\n这是审核制，**48 小时内**出结果。通过后会私信详细地址并拉群。\n没排上也别介意，我们会把 GitHub 地址和装机文档发给你。"
            });
