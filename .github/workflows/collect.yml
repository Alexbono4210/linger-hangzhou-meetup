name: 收集报名

on:
  issues:
    types: [opened, edited, reopened, labeled]

# 关键：只申请 issues 写权限，不申请 contents 写权限
# → 不需要在 Settings 里改 Workflow permissions，新仓库默认就能跑
permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取全部报名 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list \
            --state all \
            --limit 500 \
            --json number,title,body,author,createdAt,labels \
            > issues.json
          echo "抓取 $(python -c "import json;print(len(json.load(open('issues.json'))))") 个 Issue"

      - name: 重建报名表格
        run: python scripts/build_table.py

      - name: 上传表格
        uses: actions/upload-artifact@v4
        with:
          name: registrations
          path: data/registrations.csv
          retention-days: 90

      - name: 推送飞书群
        if: github.event.action == 'opened'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python scripts/notify.py

      - name: 回复报名者
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            if (!body.includes("### GitHub 用户名") && !body.includes("### 想被怎么称呼")) {
              core.info("不是报名单，跳过");
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ 报名已收到，已进审核表。\n\n这是审核制，**48 小时内**出结果。通过后会私信详细地址并拉群。\n没排上也别介意，我们会把 GitHub 地址和装机文档发给你。"
            });
